services:
# database service
  db:
    image: postgres:16
    container_name: fitflow-db
    restart: unless-stopped
    # load .env file
    env_file:
      - .env
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-fitflow}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - fitflow-network

